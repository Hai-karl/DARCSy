body{margin:0;background:var(--bg);color:var(--ink);font:400 15px/1.5 Barlow,system-ui,sans-serif}
.w{max-width:1120px;margin:0 auto;padding:20px 18px 48px}
.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}

h1{font-size:20px;font-weight:600}h2{font-size:17px;font-weight:600}

:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
.bar{display:flex;gap:8px;flex-wrap:wrap;margin:18px 0 14px;align-items:center}
.seg{display:flex;border:1px solid var(--ln);border-radius:6px;overflow:hidden;background:var(--sf)}
.seg button{border:0;background:none;padding:6px 14px;cursor:pointer}

.hero .n b{color:var(--sg);font-weight:700}
.cv{position:relative;width:100%;margin-top:14px}
.stats{display:flex;flex-wrap:wrap;margin:16px 0 0;border-top:1px solid var(--ln)}
.stats div{flex:1 1 150px;padding:12px 0 2px}.stats .n{font-size:24px;font-weight:600}
.g{display:grid;grid-template-columns:1fr 1fr;gap:16px;margin-top:16px}
@media (max-width:760px){.g{grid-template-columns:1fr}.hero{padding:16px}}
.p{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:18px}
.p header{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:6px}
.br{display:grid;grid-template-columns:130px 1fr 52px;gap:10px;align-items:center;margin:9px 0;font-size:14px}
.br i{display:block;height:8px;border-radius:4px;background:var(--ac)}
.br i.s{background:var(--sg)}.br span:last-child{text-align:right;font-variant-numeric:tabular-nums}
.tw{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:14px;min-width:620px}

td{padding:9px 8px;border-bottom:1px solid var(--ln);vertical-align:top}
.cf{display:inline-block;height:6px;border-radius:3px;background:var(--ac);vertical-align:middle;margin-right:6px}
.btn{background:var(--ac);color:var(--sf);border:0;border-radius:6px;padding:8px 16px;font-weight:600;cursor:pointer}
.f{display:flex;gap:10px;flex-wrap:wrap;align-items:end}.f label{display:grid;gap:3px;font-size:13px;color:var(--mu)}
.f input{width:110px}.msg{margin-top:10px;font-size:14px}.msg.e{color:var(--sg)}.msg.k{color:var(--ok)}
.lock{padding:40px 24px;text-align:center}
